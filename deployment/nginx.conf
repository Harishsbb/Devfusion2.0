# DevCollab Production Nginx Load Balancer Configuration
# This configuration demonstrates how to set up Nginx as a highly efficient, production-grade
# load balancer for the DevCollab backend, complete with WebSocket support and sticky sessions.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 10240; # Raised for high concurrent WebSocket connections
    use epoll; # Optimize connection processing for Linux
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access_log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream definition for backend servers
    # NOTE: Socket.io requires sticky sessions. Nginx's 'ip_hash' ensures that requests
    # from the same client IP are routed to the same backend server instance.
    upstream backend_servers {
        ip_hash; # Sticky sessions based on Client IP (Crucial for Socket.io long-polling)
        
        server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5002 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5003 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5004 max_fails=3 fail_timeout=10s;
        
        keepalive 64; # Keep-alive connections to upstream to reduce TCP overhead
    }

    # Cache configurations (Optional but recommended)
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=1g inactive=60m use_temp_path=off;

    server {
        listen 80;
        server_name api.devcollab.local; # Replace with your domain

        # Redirect all HTTP requests to HTTPS in production
        # return 301 https://$host$request_uri;

        # Healthcheck Endpoint
        location /api/health {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket and Standard API Traffic routing
        location / {
            proxy_pass http://backend_servers;
            
            # Setup HTTP/1.1 for persistent connections
            proxy_http_version 1.1;
            
            # WebSocket Support headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Timeouts for persistent WebSockets (Prevent Nginx from closing idle sockets)
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;

            # Buffering tweaks for low-latency WebSockets
            proxy_buffering off;
            
            # Maximum upload size for assets
            client_max_body_size 10m;
        }
    }
}
